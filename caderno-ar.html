<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Caderno AR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: -apple-system, sans-serif; }

    #overlay {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 999;
      display: flex;
      justify-content: center;
      padding: 16px;
      pointer-events: none;
    }

    #status {
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
    }

    #note-panel {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 999;
      background: white;
      border-radius: 20px 20px 0 0;
      padding: 24px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
      pointer-events: auto;
    }

    #note-panel h2 { margin-top: 0; }

    #note-panel textarea {
      width: 100%;
      min-height: 140px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-family: inherit;
      resize: vertical;
    }

    #note-panel .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }

    #note-panel button {
      padding: 10px 18px;
      background: #d97757;
      color: white;
      border: none;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
    }

    #save-status {
      font-size: 13px;
      color: #999;
    }

    #note-panel.visible { display: block; }

    .arjs-loader {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 998;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="arjs-loader">
    <div>Carregando reconhecimento de imagem…</div>
  </div>

  <div id="overlay">
    <div id="status">Aponte a câmera para a foto…</div>
  </div>

  <div id="note-panel">
    <h2>📓 Página reconhecida!</h2>
    <textarea id="note-text" placeholder="Escreva as anotações desta página aqui…"></textarea>
    <div class="row">
      <span id="save-status"></span>
      <button id="save-btn">Salvar</button>
    </div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <!-- 
      Marcador NFT: aponta para os arquivos marker/marker_small.fset, .fset3, .iset
      (sem a extensão no atributo url — o AR.js busca os três automaticamente)
    -->
    <a-nft
      type="nft"
      url="marker/marker_small"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
      id="marker">
      <a-plane
        position="0 0 0"
        rotation="0 0 0"
        width="1" height="1.3"
        material="color: #d97757; opacity: 0.15; transparent: true">
      </a-plane>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const marker = document.querySelector('#marker');
    const panel = document.querySelector('#note-panel');
    const status = document.querySelector('#status');
    const noteText = document.querySelector('#note-text');
    const saveBtn = document.querySelector('#save-btn');
    const saveStatus = document.querySelector('#save-status');

    const MARKER_ID = 'foto-familia';
    const STORAGE_KEY = 'notas_' + MARKER_ID;

    function loadNote() {
      const saved = localStorage.getItem(STORAGE_KEY);
      noteText.value = saved || '';
    }

    function saveNote() {
      localStorage.setItem(STORAGE_KEY, noteText.value);
      saveStatus.textContent = 'Salvo ✓';
      setTimeout(() => { saveStatus.textContent = ''; }, 1500);
    }

    saveBtn.addEventListener('click', saveNote);

    let debounceTimer;
    noteText.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      saveStatus.textContent = 'Digitando…';
      debounceTimer = setTimeout(saveNote, 800);
    });

    marker.addEventListener('markerFound', () => {
      loadNote();
      panel.classList.add('visible');
      status.textContent = '✅ Foto reconhecida!';
    });

    marker.addEventListener('markerLost', () => {
      panel.classList.remove('visible');
      status.textContent = 'Aponte a câmera para a foto…';
    });
  </script>

</body>
</html>
